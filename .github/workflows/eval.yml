name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/ -q --cov=evalkit --cov-report=term-missing

  gate:
    # The release gate itself. Runs offline against fixtures, so it needs no
    # API key and no secrets — a fork's pull request gets the same signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run golden set against the baseline
        run: |
          python -m evalkit.cli run examples/support_suite.json \
            --fixtures examples/fixtures_good.json \
            --thresholds examples/thresholds.json \
            --baseline examples/baseline.json \
            --out report.json

      - name: Prove the gate blocks a regression
        # Inverted check: the regressed fixtures MUST fail. If this step
        # succeeds, the gate has stopped working and the suite is worthless.
        run: |
          if python -m evalkit.cli run examples/support_suite.json \
               --fixtures examples/fixtures_regressed.json \
               --thresholds examples/thresholds.json \
               --baseline examples/baseline.json > /dev/null 2>&1; then
            echo "::error::The gate accepted a known-bad run. The gate is broken."
            exit 1
          fi
          echo "Gate correctly rejected the regressed run."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: report.json
