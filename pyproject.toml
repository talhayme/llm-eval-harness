[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "A dependency-light evaluation harness and release gate for LLM features"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vitalii Bogachev" }]
keywords = ["llm", "evaluation", "testing", "regression", "ci", "hallucination"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "pyyaml>=6"]
openai = ["openai>=1.0"]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
